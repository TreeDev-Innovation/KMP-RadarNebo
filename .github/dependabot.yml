version: 2
# One grouped pull request per ecosystem each week.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /mission-control/server
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Dependabot can't tell LTS from non-LTS JDKs, and a non-LTS image stops getting OS patches once it's EOL
    # (24-jre failed the Trivy scan). Move between LTS releases by hand; digest refreshes still come through.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /mission-control/server
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
